GetAdminUsers:
    summary: Get admin users
    operationId: getAdminUsers
    tags:
        - AdminUsers

    parameters:
        - in: query
          name: page
          schema:
              type: integer
              minimum: 1
              example: 1
        - in: query
          name: limit
          schema:
              type: integer
              minimum: 1
              maximum: 100
              example: 20
        - in: query
          name: search
          schema:
              type: string
              example: '@ivan'
        - in: query
          name: isBanned
          schema:
              type: boolean
              example: false
        - in: query
          name: role
          schema:
              type: string
              enum: [user, admin]
              example: user

    responses:
        '200':
            description: Users list
            content:
                application/json:
                    schema:
                        $ref: '../responses/users.yaml#/UsersListResponse'
        '401':
            $ref: '../responses/error.yaml#/Unauthorized'
        '403':
            $ref: '../responses/error.yaml#/Forbidden'
        '500':
            $ref: '../responses/error.yaml#/InternalServerError'

GetAdminUser:
    summary: Get admin user by ID
    operationId: getAdminUser
    tags:
        - AdminUsers

    parameters:
        - in: path
          name: id
          required: true
          schema:
              type: string
              format: uuid
              example: '019e569b-5d3d-76e0-9e3b-933e1806a0cc'

    responses:
        '200':
            description: User details
            content:
                application/json:
                    schema:
                        $ref: '../responses/users.yaml#/UserResponse'
        '400':
            $ref: '../responses/error.yaml#/BadRequest'
        '401':
            $ref: '../responses/error.yaml#/Unauthorized'
        '403':
            $ref: '../responses/error.yaml#/Forbidden'
        '404':
            $ref: '../responses/error.yaml#/NotFound'

