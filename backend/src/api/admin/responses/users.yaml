AdminUserSimpleCollection:
    type: object
    required:
        - total
        - count
        - items
    properties:
        total:
            type: integer
            minimum: 0
        count:
            type: integer
            minimum: 0
        items:
            type: array
            items: {}

AdminUserEngagement:
    type: object
    required:
        - promoCodes
        - tasks
        - referrals
        - reactions
        - dailyReward
    properties:
        promoCodes:
            allOf:
                - $ref: '#/AdminUserSimpleCollection'
                - type: object
                  properties:
                      items:
                          type: array
                          items:
                              $ref: '#/AdminUserPromoCode'
        tasks:
            allOf:
                - $ref: '#/AdminUserSimpleCollection'
                - type: object
                  properties:
                      items:
                          type: array
                          items:
                              $ref: '#/AdminUserTask'
        referrals:
            type: object
            required:
                - referredBy
                - total
                - count
                - items
            properties:
                referredBy:
                    anyOf:
                        - $ref: '#/AdminUserReferral'
                        - type: 'null'
                    example: null
                total:
                    type: integer
                    minimum: 0
                    example: 0
                count:
                    type: integer
                    minimum: 0
                    example: 0
                items:
                    type: array
                    items:
                        $ref: '#/AdminUserReferral'
        reactions:
            allOf:
                - $ref: '#/AdminUserSimpleCollection'
                - type: object
                  properties:
                      items:
                          type: array
                          items:
                              $ref: '#/AdminUserReaction'
        dailyReward:
            $ref: '#/AdminUserDailyReward'

AdminUserDetails:
    allOf:
        - $ref: '#/AdminUserBase'
        - type: object
          required:
              - balance
              - overview
              - content
              - finance
              - engagement
              - charactersCount
              - characters
              - scenariosCount
              - scenarios
              - chatsCount
              - activeChatsCount
              - chats
          properties:
              balance:
                  type: integer
                  example: 218
              subscription:
                  $ref: '#/AuthUserSubscription'
              overview:
                  $ref: '#/AdminUserOverview'
              content:
                  $ref: '#/AdminUserContent'
              finance:
                  $ref: '#/AdminUserFinance'
              engagement:
                  $ref: '#/AdminUserEngagement'
              charactersCount:
                  type: integer
                  minimum: 0
                  example: 1
              characters:
                  type: array
                  items:
                      $ref: '#/AdminUserCharacter'
              scenariosCount:
                  type: integer
                  minimum: 0
                  example: 2
              scenarios:
                  type: array
                  items:
                      $ref: '#/AdminUserScenario'
              chatsCount:
                  type: integer
                  minimum: 0
                  example: 2
              activeChatsCount:
                  type: integer
                  minimum: 0
                  example: 2
              chats:
                  type: array
                  items:
                      $ref: '#/AdminUserChat'

UserResponse:
    type: object
    required:
        - ok
        - user
    properties:
        ok:
            type: boolean
            example: true
        user:
            $ref: '#/AdminUserDetails'

UserProfileResponse:
    type: object
    required:
        - ok
