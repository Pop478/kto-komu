        - id
        - name
        - greetingMessage
        - model
        - provider
    properties:
        id:
            type: string
            format: uuid
        name:
            type: string
            example: 'Test scenario'
        greetingMessage:
            type:
                - string
                - 'null'
            example: 'Hello!'
        model:
            type:
                - string
                - 'null'
            example: 'baidu/cobuddy:free'
        provider:
            type:
                - string
                - 'null'
            example: openrouter

AdminUserChat:
    type: object
    required:
        - id
        - userId
        - characterId
        - scenarioId
        - title
        - status
        - characterSnapshot
        - scenarioSnapshot
        - lastMessageAt
        - deletedAt
        - createdAt
        - updatedAt
        - messagesCount
        - attachmentsCount
        - character
        - scenario
    properties:
        id:
            type: string
            format: uuid
        userId:
            type: string
            format: uuid
        characterId:
            type: string
            format: uuid
        scenarioId:
            type: string
            format: uuid
        title:
            type:
                - string
                - 'null'
            example: 'Rimuru Tempest'
        status:
            type: string
            enum:
                - active
                - archived
                - deleted
            example: active
        characterSnapshot:
            type:
                - object
                - 'null'
            additionalProperties: true
        scenarioSnapshot:
            type:
                - object
                - 'null'
            additionalProperties: true
            example: null
        lastMessageAt:
            type:
                - string
                - 'null'
            format: date-time
        deletedAt:
            type:
                - string
                - 'null'
            format: date-time
            example: null
        createdAt:
            type: string
            format: date-time
        updatedAt:
            type: string
            format: date-time
        messagesCount:
            type: integer
            minimum: 0
            example: 2
        attachmentsCount:
            type: integer
            minimum: 0
            example: 0
        character:
            $ref: '#/AdminUserChatCharacter'
        scenario:
            $ref: '#/AdminUserChatScenario'

AdminUserContent:
    type: object
    required:
        - charactersCount
        - scenariosCount
        - chatsCount
        - activeChatsCount
        - characters
        - scenarios
        - chats
    properties:
        charactersCount:
            type: integer
            minimum: 0
            example: 1
        scenariosCount:
            type: integer
            minimum: 0
            example: 2
        chatsCount:
            type: integer
            minimum: 0
            example: 2
        activeChatsCount:
            type: integer
            minimum: 0
            example: 2
        characters:
            type: array
            items:
                $ref: '#/AdminUserCharacter'
        scenarios:
            type: array
            items:
                $ref: '#/AdminUserScenario'
        chats:
            type: array
            items:
                $ref: '#/AdminUserChat'

AdminUserBalanceTransaction:
    type: object
    required:
        - id
        - userId
        - balanceId
        - type
        - direction
        - amount
        - balanceBefore
        - balanceAfter
        - entityType
        - entityId
        - description
        - metadata
        - createdAt
    properties:
        id:
            type: string
            format: uuid
        userId:
            type: string
            format: uuid
        balanceId:
            type: string
            format: uuid
        type:
            type: string
            enum:
                - top_up
                - message_generation
                - image_generation
                - task_reward
                - referral_reward
                - subscription_bonus
                - promo_code
                - admin_credit
                - admin_debit
                - daily_reward
                - refund
                - other
            example: message_generation
        direction:
            type: string
            enum:
                - credit
                - debit
            example: debit
        amount:
            type: integer
            example: 1
        balanceBefore:
            type: integer
            example: 219
        balanceAfter:
            type: integer
            example: 218
        entityType:
            type:
                - string
                - 'null'
            example: ChatMessage
        entityId:
            type:
                - string
                - 'null'
            format: uuid
        description:
            type:
                - string
                - 'null'
            example: 'User chat message'
        metadata:
            type:
                - object
                - 'null'
            additionalProperties: true
        createdAt:
            type: string
            format: date-time

AdminUserBalancePayment:
    type: object
    required:
        - id
        - userId
        - packageId
        - tokens
        - amount
        - currency
        - method
        - status
        - provider
        - providerPaymentId
        - paymentUrl
        - transactionId
        - metadata
        - paidAt
        - failedAt
        - canceledAt
        - createdAt
        - updatedAt
    properties:
        id:
            type: string
            format: uuid
        userId:
            type: string
            format: uuid
        packageId:
            type: string
            example: tokens_1000
        tokens:
            type: integer
            example: 1000
        amount:
            type: integer
            example: 300
        currency:
            type: string
            example: XTR
        method:
            type: string
            enum:
                - stars
                - rub
            example: stars
        status:
            type: string
            enum:
                - pending
                - paid
                - failed
                - canceled
            example: pending
        provider:
            type:
                - string
                - 'null'
            example: telegram_stars
        providerPaymentId:
            type:
                - string
                - 'null'
            example: null
        paymentUrl:
            type:
                - string
                - 'null'
            format: uri
        transactionId:
            type:
                - string
                - 'null'
            format: uuid
            example: null
        metadata:
            type:
                - object
                - 'null'
            additionalProperties: true
        paidAt:
            type:
                - string
                - 'null'
            format: date-time
            example: null
        failedAt:
            type:
                - string
                - 'null'
            format: date-time
            example: null
        canceledAt:
            type:
                - string
                - 'null'
            format: date-time
            example: null
        createdAt:
            type: string
            format: date-time
        updatedAt:
            type: string
            format: date-time

AdminUserPaginatedItems:
    type: object
    required:
        - total
        - count
        - limit
        - offset
        - items
    properties:
        total:
            type: integer
            minimum: 0
            example: 43
        count:
            type: integer
            minimum: 0
            example: 20
        limit:
            type: integer
            minimum: 1
            example: 20
        offset:
            type: integer
            minimum: 0
            example: 0
        items:
            type: array
            items: {}

AdminUserFinance:
    type: object
    required:
        - balance
        - transactions
        - payments
    properties:
        balance:
            type: integer
            example: 218
        transactions:
            allOf:
                - $ref: '#/AdminUserPaginatedItems'
                - type: object
                  properties:
                      items:
                          type: array
                          items:
                              $ref: '#/AdminUserBalanceTransaction'
        payments:
            allOf:
                - $ref: '#/AdminUserPaginatedItems'
                - type: object
                  properties:
                      total:
                          example: 1
                      count:
                          example: 1
                      items:
                          type: array
                          items:
                              $ref: '#/AdminUserBalancePayment'

AdminUserPromoCode:
    type: object
    additionalProperties: true
    required:
        - id
        - userId
        - promoCodeId
        - balanceAmount
        - transactionId
        - usedAt
    properties:
        id:
            type: string
            format: uuid
        userId:
            type: string
            format: uuid
        promoCodeId:
            type: string
            format: uuid
        balanceAmount:
            type: integer
            example: 5
        transactionId:
            type:
                - string
                - 'null'
            format: uuid
        usedAt:
            type: string
            format: date-time
        promoCode:
            type: object
            additionalProperties: true
        transaction:
            $ref: '#/AdminUserBalanceTransaction'

AdminUserTask:
