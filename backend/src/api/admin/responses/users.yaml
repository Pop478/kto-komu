AdminUserBase:
    type: object
    required:
        - id
        - telegramId
        - username
        - first_name
        - last_name
        - is_premium
        - languageCode
        - photo_url
        - role
        - theme
        - ban
        - isBanned
        - is_active
        - createdAt
        - updatedAt
    properties:
        id:
            type: string
            format: uuid
            example: '019e569b-5d3d-76e0-9e3b-933e1806a0cc'
        telegramId:
            type:
                - string
                - 'null'
            example: '6337131614'
        username:
            type:
                - string
                - 'null'
            example: Ivan
        first_name:
            type:
                - string
                - 'null'
            example: Ivan
        last_name:
            type:
                - string
                - 'null'
            example: ''
        is_premium:
            type: boolean
            example: false
        languageCode:
            type:
                - string
                - 'null'
            example: ru
        photo_url:
            type:
                - string
                - 'null'
            format: uri
            example: 'https://example.com/avatar.svg'
        role:
            type: string
            enum:
                - user
                - manager
                - admin
            example: user
        theme:
            type: string
            enum:
                - light
                - dark
                - system
            example: dark
        ban:
            type: boolean
            example: false
        isBanned:
            type: boolean
            example: false
        is_active:
            type: boolean
            example: true
        createdAt:
            type: string
            format: date-time
            example: '2026-05-23T20:51:23.070Z'
        updatedAt:
            type: string
            format: date-time
            example: '2026-05-27T09:33:22.074Z'

AdminUserListItem:
    allOf:
        - $ref: '#/AdminUserBase'

UsersListResponse:
    type: object
    required:
        - ok
        - users
        - pagination
    properties:
        ok:
            type: boolean
            example: true
        users:
            type: array
            items:
                $ref: '#/AdminUserListItem'
        pagination:
            type: object
            required:
                - page
                - limit
                - total
                - totalPages
            properties:
                page:
                    type: integer
                    minimum: 1
                    example: 1
                limit:
                    type: integer
                    minimum: 1
                    maximum: 100
                    example: 20
                total:
                    type: integer
                    minimum: 0
                    example: 100
                totalPages:
                    type: integer
                    minimum: 0
                    example: 5

AdminUserOverview:
    type: object
    required:
        - balance
        - subscription
        - charactersCount
        - scenariosCount
        - activeChatsCount
        - chatsCount
        - transactionsCount
        - paymentsCount
        - promoCodesCount
        - tasksCount
        - referralsCount
        - reactionsCount
    properties:
        balance:
            type: integer
            example: 218
        subscription:
            $ref: '#/subscriptionTier'
        charactersCount:
            type: integer
            minimum: 0
            example: 1
        scenariosCount:
            type: integer
            minimum: 0
            example: 2
        activeChatsCount:
            type: integer
            minimum: 0
            example: 2
        chatsCount:
            type: integer
            minimum: 0
            example: 2
        transactionsCount:
            type: integer
            minimum: 0
            example: 43
        paymentsCount:
            type: integer
            minimum: 0
            example: 1
        promoCodesCount:
            type: integer
            minimum: 0
            example: 2
        tasksCount:
            type: integer
            minimum: 0
            example: 1
        referralsCount:
            type: integer
            minimum: 0
            example: 0
        reactionsCount:
            type: integer
            minimum: 0
            example: 1

subscriptionTier:
    type: string
    enum:
        - PLUS
        - PREMIUM
        - LEGENDARY
    example: PREMIUM

AuthUserSubscription:
    type: object
    nullable: true
    required:
        - tier
        - startsAt
        - expiresAt
    properties:
        userId:
            type: string
            format: uuid
            example: '019e569b-5d3d-76e0-9e3b-933e1806a0cc'
        status:
            type: string
            enum:
                - pending
                - active
                - expired
                - canceled
        tier:
            $ref: '#/subscriptionTier'
        startsAt:
            type: string
            format: date-time
            example: '2026-07-03T10:00:00.000Z'
        expiresAt:
            type: string
            format: date-time
            example: '2026-08-03T10:00:00.000Z'
        createdAt:
            type: string
            format: date-time
            example: '2026-08-03T10:00:00.000Z'
        updatedAt:
            type: string
            format: date-time
            example: '2026-08-03T10:00:00.000Z'

AdminUserUniverse:
    type:
        - object
        - 'null'
    required:
        - id
        - name
        - imageUrl
    properties:
        id:
            type: string
            format: uuid
            example: '019e569b-5d3d-76e0-9e3b-933e1806a0c1'
        name:
            type: string
            example: 'Fantasy World'
        imageUrl:
            type:
                - string
                - 'null'
            format: uri
            example: 'http://localhost:5000/api/public/character/naruto.webp'

AdminUserCharacter:
    type: object
    required:
        - id
        - universeId
        - userId
        - source
        - name
        - photoUrl
        - description
        - gender
        - age
        - systemPrompt
        - chatsCount
        - isActive
        - createdAt
        - updatedAt
        - universe
    properties:
        id:
            type: string
            format: uuid
        universeId:
            type:
                - string
                - 'null'
            format: uuid
        userId:
            type:
                - string
                - 'null'
            format: uuid
        source:
            type: string
            enum:
                - system
                - user
            example: user
        name:
            type: string
            example: 'Rimuru Tempest'
        photoUrl:
            type:
                - string
                - 'null'
            format: uri
        description:
            type:
                - string
                - 'null'
            example: 'User-created character description'
        gender:
            type: string
            enum:
                - male
                - female
                - other
            example: male
        age:
            type:
                - integer
                - 'null'
            example: 24
        systemPrompt:
            type: string
            example: 'Character system prompt'
        chatsCount:
            type: integer
            minimum: 0
            example: 2
        isActive:
            type: boolean
            example: true
        createdAt:
            type: string
            format: date-time
        updatedAt:
            type: string
            format: date-time
        universe:
            $ref: '#/AdminUserUniverse'

AdminUserScenarioCharacter:
    type:
        - object
        - 'null'
    required:
        - id
        - name
        - photoUrl
    properties:
        id:
            type: string
            format: uuid
        name:
            type: string
            example: 'Rimuru Tempest'
        photoUrl:
            type:
                - string
                - 'null'
            format: uri

AdminUserScenario:
    type: object
    required:
        - id
        - characterId
        - userId
        - source
        - name
        - photoUrl
        - description
        - tags
        - systemPrompt
        - greetingMessage
        - model
        - provider
        - temperature
        - topP
        - maxTokens
        - presencePenalty
        - frequencyPenalty
        - settings
        - isActive
        - createdAt
        - updatedAt
        - character
    properties:
        id:
            type: string
            format: uuid
        characterId:
            type:
                - string
                - 'null'
            format: uuid
        userId:
            type:
                - string
                - 'null'
            format: uuid
        source:
            type: string
            enum:
                - system
                - user
            example: user
        name:
            type: string
            example: 'Romantic adventure'
        photoUrl:
            type:
                - string
                - 'null'
            format: uri
        description:
            type:
                - string
                - 'null'
            example: 'Scenario description'
        tags:
            type: array
            items:
                type: string
            example:
                - romance
                - adventure
        systemPrompt:
            type: string
            example: 'Scenario system prompt'
        greetingMessage:
            type:
                - string
                - 'null'
            example: 'Hello!'
        model:
            type:
                - string
                - 'null'
            example: 'google/gemma-4-26b-a4b-it:free'
        provider:
            type:
                - string
                - 'null'
            example: openrouter
        temperature:
            type: number
            example: 0.7
        topP:
            type: number
            example: 1
        maxTokens:
            type:
                - integer
                - 'null'
            example: 1000
        presencePenalty:
            type:
                - number
                - 'null'
            example: null
        frequencyPenalty:
            type:
                - number
                - 'null'
            example: null
        settings:
            type:
                - object
                - 'null'
            additionalProperties: true
            example: null
        isActive:
            type: boolean
            example: true
        createdAt:
            type: string
            format: date-time
        updatedAt:
            type: string
            format: date-time
        character:
            $ref: '#/AdminUserScenarioCharacter'

AdminUserChatCharacter:
    type:
        - object
        - 'null'
    required:
        - id
        - name
        - photoUrl
        - description
    properties:
        id:
            type: string
            format: uuid
        name:
            type: string
            example: 'Rimuru Tempest'
        photoUrl:
            type:
                - string
                - 'null'
            format: uri
        description:
            type:
                - string
                - 'null'
            example: 'Character description'

AdminUserChatScenario:
    type:
        - object
        - 'null'
