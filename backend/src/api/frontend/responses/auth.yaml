AuthSuccessResponse:
    type: object
    required:
        - ok
        - user
    properties:
        ok:
            type: boolean
            const: true
        user:
            $ref: '#/AuthUser'
        isNewUser:
            type: boolean
            description: Present after an OAuth callback; true when a new account was created.

AuthBannedResponse:
    type: object
    required:
        - ok
        - banned
        - error
    properties:
        ok:
            type: boolean
            const: false
        banned:
            type: boolean
            const: true
        error:
            type: string
            const: USER_BANNED

AuthUser:
    type: object
    required:
        - id
        - theme
        - status
        - termsAccepted
        - createdAt
        - providers
    properties:
        id:
            type: string
            format: uuid
            example: 019e3858-fdaa-7728-b8f5-990013a67f1d
        username:
            type:
                - string
                - 'null'
            maxLength: 32
            example: stepazavrik
        firstName:
            type:
                - string
                - 'null'
            maxLength: 100
        lastName:
            type:
                - string
                - 'null'
            maxLength: 100
        gender:
            type:
                - string
                - 'null'
            enum:
                - MALE
                - FEMALE
                - OTHER
                - null
        birthDate:
            type:
                - string
                - 'null'
            format: date-time
        photoUrl:
            type:
                - string
                - 'null'
            format: uri
        email:
            type:
                - string
                - 'null'
            format: email
        emailVerifiedAt:
            type:
                - string
                - 'null'
            format: date-time
        languageCode:
            type:
                - string
                - 'null'
            maxLength: 35
            example: ru
        theme:
            type: string
            enum:
                - LIGHT
                - DARK
                - SYSTEM
        status:
            type: string
            enum:
                - GUEST
                - REGISTERED
        termsAccepted:
            type: boolean
        createdAt:
            type: string
            format: date-time
        providers:
            type: array
            description: OAuth identities linked to this account.
            items:
                $ref: '#/OAuthProvider'

OAuthProvider:
    type: object
    required:
        - provider
        - providerUserId
    properties:
        provider:
            type: string
            example: yandex
        providerUserId:
            type: string
            example: '1234567890'

LogoutSuccessResponse:
    type: object
    required:
        - ok
    properties:
        ok:
            type: boolean
            const: true
